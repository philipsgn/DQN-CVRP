<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteFlow AI — Apple Studio Light Logistics Dispatcher</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #f8fafc; overflow: hidden; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 99px; }

    /* Map Grayscale & Contrast */
    .leaflet-container { background: #f8fafc !important; }
    .leaflet-tile-pane { filter: contrast(95%) brightness(102%); }

    /* Minimalist Apple Studio Card (No chunky borders) */
    .apple-item {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .apple-item:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .apple-item.active {
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(0, 113, 227, 0.12);
    }

    /* Spring Curve Drawer Transition */
    .sidebar-drawer {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-screen w-screen flex text-slate-900 select-none bg-slate-50 relative">

  <!-- 1. LEFT VERTICAL NAVIGATION RAIL (Mac Minimalist Style) -->
  <aside class="w-[68px] bg-white/80 backdrop-blur-2xl flex flex-col items-center py-6 justify-between z-30 shadow-sm">
    <div class="flex flex-col items-center gap-2">
      <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-lg shadow-slate-900/15">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span class="text-[10px] font-bold text-slate-800">DQN</span>
    </div>

    <!-- Nav Icons -->
    <nav class="flex flex-col items-center gap-2.5 w-full px-2">
      <button class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition" title="Tổng quan">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </button>
      <button class="w-10 h-10 rounded-xl bg-[#0071e3] text-white flex items-center justify-center shadow-md shadow-blue-500/20" title="Bản đồ TP.HCM">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      </button>
      <button class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition" title="Thống kê DRL">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      </button>
    </nav>

    <!-- Profile -->
    <div class="flex flex-col items-center gap-3">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=FPT" alt="User" class="w-8 h-8 rounded-full bg-slate-100 object-cover shadow-xs" />
    </div>
  </aside>

  <!-- 2. COLLAPSIBLE DISPATCH LIST (Apple Borderless Style) -->
  <section id="sidebarDrawer" class="sidebar-drawer w-[360px] bg-slate-50/90 backdrop-blur-2xl flex flex-col h-full z-20 px-5 py-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-base font-bold text-slate-900 tracking-tight">Điều phối TP.HCM</h2>
        <p class="text-xs text-slate-400 font-medium">Nhóm 10 • Đại học FPT</p>
      </div>
      <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-[#0071e3]">Double DQN</span>
    </div>

    <!-- Search Input (Borderless) -->
    <div class="relative mb-4">
      <input id="searchInput" type="text" placeholder="Tìm kiếm địa điểm, quận huyện..." 
        class="w-full bg-white/80 rounded-xl px-4 py-2.5 text-xs font-medium text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-100 shadow-sm transition" />
    </div>

    <!-- Shipment List -->
    <div id="shipmentList" class="flex-1 overflow-y-auto space-y-3 pr-1">
      <!-- Cards rendered borderless -->
    </div>
  </section>

  <!-- 3. MAP CANVAS -->
  <main class="flex-1 relative h-full">
    <div id="map" class="w-full h-full z-10"></div>

    <!-- Floating Top Telemetry Capsule -->
    <div class="absolute top-5 right-6 z-20 bg-white/85 backdrop-blur-2xl rounded-full px-5 py-2.5 shadow-lg shadow-slate-900/5 flex items-center gap-6">
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">TỔNG CỰ LY</div>
        <div id="hudDistance" class="text-xs font-bold text-slate-900">143.59 km</div>
      </div>
      <div class="h-6 w-[1px] bg-slate-200/80"></div>
      <div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">TIẾT KIỆM CW</div>
        <div id="hudSavings" class="text-xs font-bold text-emerald-600">0.00%</div>
      </div>
      <div class="h-6 w-[1px] bg-slate-200/80"></div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-xs shadow-emerald-500/50"></span>
        <span class="text-xs font-semibold text-emerald-600">100% Feasible</span>
      </div>
    </div>

    <!-- Bottom Center Mac Toolbar Dock -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-white/90 backdrop-blur-2xl rounded-full px-4 py-2 shadow-2xl shadow-slate-900/15 flex items-center gap-3">
      <button onclick="simulateStep()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">
        <svg class="w-4 h-4 text-[#0071e3]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
        <span>Bước tiếp</span>
      </button>

      <button onclick="toggleAuto()" id="autoBtn" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-[#0071e3] text-white shadow-md shadow-blue-500/30 hover:bg-[#0077ed] transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
        <span>Tự động</span>
      </button>

      <div class="w-[1px] h-5 bg-slate-200"></div>

      <button onclick="toggleBikeSim()" id="bikeBtn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">
        <span>🏍️</span>
        <span>Xe máy Shipper</span>
      </button>
    </div>
  </main>

  <script>
    const shipments = [
      {
        id: "ĐH FPT TP.HCM",
        district: "TP. Thủ Đức",
        dest: "Khu CNC, Long Thạnh Mỹ",
        client: "Kho Tổng Xuất Phát",
        distance: "0.0 km",
        lat: 10.8415, lng: 106.8098
      },
      {
        id: "Chợ Bến Thành",
        district: "Quận 1",
        dest: "Đường Lê Lợi, Bến Thành",
        client: "4 kiện hàng",
        distance: "16.2 km",
        lat: 10.7725, lng: 106.6980
      },
      {
        id: "Landmark 81",
        district: "Quận Bình Thạnh",
        dest: "720A Điện Biên Phủ",
        client: "5 kiện hàng",
        distance: "12.8 km",
        lat: 10.7951, lng: 106.7218
      },
      {
        id: "Chợ Lớn (Bình Tây)",
        district: "Quận 5",
        dest: "Tháp Mười, Phường 2",
        client: "6 kiện hàng",
        distance: "21.4 km",
        lat: 10.7497, lng: 106.6521
      }
    ];

    let activeIndex = 0;
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([10.8231, 106.7292], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const routesLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);

    function renderShipments() {
      const container = document.getElementById('shipmentList');
      container.innerHTML = "";
      shipments.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `apple-item rounded-2xl p-3.5 cursor-pointer ${idx === activeIndex ? 'active' : ''}`;
        card.onclick = () => selectItem(idx);
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-800">${item.id}</span>
            <span class="text-[10px] font-semibold text-[#0071e3] bg-blue-50 px-2 py-0.5 rounded-full">${item.district}</span>
          </div>
          <div class="text-[11px] text-slate-500 mt-1">${item.dest}</div>
          <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-100 text-[10px] text-slate-400">
            <span>${item.client}</span>
            <span class="font-bold text-slate-700">${item.distance}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectItem(idx) {
      activeIndex = idx;
      renderShipments();
      map.flyTo([shipments[idx].lat, shipments[idx].lng], 14, { duration: 0.8 });
    }

    function simulateStep() {
      alert("Đang chọn toán tử qua DQN Agent...");
    }

    function toggleAuto() {
      alert("Đã bắt đầu chu kỳ tối ưu tự động!");
    }

    function toggleBikeSim() {
      alert("Xe máy Shipper đang di chuyển trên đường phố OSRM!");
    }

    // Render Markers
    shipments.forEach((s, idx) => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="w-6 h-6 rounded-full bg-white shadow-md border-2 ${idx === 0 ? 'border-amber-500 text-amber-500' : 'border-blue-600 text-blue-600'} flex items-center justify-center font-bold text-[10px]">${idx === 0 ? '★' : idx}</div>`,
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
      L.marker([s.lat, s.lng], { icon }).addTo(markersLayer);
    });

    renderShipments();
  </script>
</body>
</html>
