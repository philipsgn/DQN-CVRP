[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqn-cvrp"
version = "0.1.0"
description = "MP-MOTO-CVRP: Deep Reinforcement Learning for Last-Mile Motorbike CVRP in HCMC"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.3,<3",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "ortools>=9.10",
    "vrplib>=1.4",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]